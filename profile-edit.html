<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit profile — TeamForge</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<nav class="nav">
  <div class="container nav__row">
    <a href="index" class="nav__brand"><span class="mark"></span> TeamForge</a>
    <div class="nav__links">
      <a href="dashboard" class="hide-mobile">Dashboard</a>
      <div id="nav-auth" style="display:flex; gap:12px; align-items:center;"></div>
    </div>
  </div>
</nav>

<section>
  <div class="container container--narrow">
    <div class="card">
      <h2>Edit profile</h2>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name">
      </div>
      <div class="field">
        <label for="bio">Short bio</label>
        <textarea id="bio" rows="3"></textarea>
      </div>
      <div class="field">
        <label for="experience">Experience level</label>
        <select id="experience">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>
      <div class="field">
        <label>Skills</label>
        <div id="skills-picker" class="ticket__tags" style="margin-top:8px;"></div>
      </div>
      <div class="field">
        <label for="interests">Interests</label>
        <input type="text" id="interests" placeholder="Comma-separated">
      </div>
      <div class="field-error" id="form-error"></div>
      <div style="display:flex; gap:10px;">
        <button id="save-btn" class="btn btn--primary">Save changes</button>
        <a href="dashboard" class="btn btn--outline">Cancel</a>
      </div>
    </div>
  </div>
</section>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { updateUserProfile } from "./js/db/users.js";
  import { listActiveSkills } from "./js/db/skills.js";
  import { toast, qs, el, renderNavAuth } from "./js/ui.js";

  let currentUid = null;
  const selectedSkills = new Set();

  requireAuth(async (user, profile, isAdmin) => {
    currentUid = user.uid;
    renderNavAuth(qs("#nav-auth"), user, profile, isAdmin);
    if (profile) {
      qs("#name").value = profile.name || "";
      qs("#bio").value = profile.bio || "";
      qs("#experience").value = profile.experience || "beginner";
      qs("#interests").value = (profile.interests || []).join(", ");
      (profile.skills || []).forEach(id => selectedSkills.add(id));
    }
    const skills = await listActiveSkills();
    renderSkills(skills);
  }, () => { window.location.href = "login"; });

  function renderSkills(skills) {
    const picker = qs("#skills-picker");
    picker.innerHTML = "";
    skills.forEach(skill => {
      const chip = el("span", {
        class: `tag ${selectedSkills.has(skill.id) ? "tag--on" : "tag--off"}`,
        onclick: () => {
          if (selectedSkills.has(skill.id)) selectedSkills.delete(skill.id);
          else selectedSkills.add(skill.id);
          renderSkills(skills);
        }
      }, skill.name);
      picker.appendChild(chip);
    });
  }

  qs("#save-btn").addEventListener("click", async () => {
    const errorBox = qs("#form-error");
    errorBox.textContent = "";
    const btn = qs("#save-btn");
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const interests = qs("#interests").value.split(",").map(s => s.trim()).filter(Boolean);
      await updateUserProfile(currentUid, {
        name: qs("#name").value.trim(),
        bio: qs("#bio").value.trim(),
        experience: qs("#experience").value,
        interests,
        skills: Array.from(selectedSkills)
      });
      toast("Profile updated", "success");
      window.location.href = "dashboard";
    } catch (err) {
      errorBox.textContent = "Couldn't save changes. Please try again.";
      btn.disabled = false; btn.textContent = "Save changes";
    }
  });
</script>
</body>
</html>
