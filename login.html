<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — TeamForge</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<nav class="nav">
  <div class="container nav__row">
    <a href="index" class="nav__brand"><span class="mark"></span> TeamForge</a>
    <div class="nav__links"><a href="signup">Sign up instead</a></div>
  </div>
</nav>

<section>
  <div class="container container--narrow">
    <div class="card form-card">
      <h2>Log in</h2>
      <p class="muted">Welcome back.</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <div class="field-error" id="form-error"></div>
        <button type="submit" class="btn btn--primary btn--full" id="submit-btn">Log in</button>
      </form>
      <p class="muted" style="margin-top:16px; text-align:center;">No account yet? <a href="signup">Sign up</a></p>
    </div>
  </div>
</section>

<script type="module">
  import { logIn, watchAuthState } from "./js/auth.js";
  import { toast, qs } from "./js/ui.js";

  // If already logged in, skip straight to the right place.
  watchAuthState((user, profile, isAdmin) => {
    if (!user) return;
    if (isAdmin) window.location.href = "admin/index";
    else if (profile && !profile.profileComplete) window.location.href = "profile-setup";
    else window.location.href = "dashboard";
  });

  qs("#login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = qs("#form-error");
    const btn = qs("#submit-btn");
    errorBox.textContent = "";
    btn.disabled = true; btn.textContent = "Logging in…";
    try {
      await logIn(qs("#email").value.trim(), qs("#password").value);
      toast("Logged in", "success");
      // watchAuthState above handles the redirect.
    } catch (err) {
      errorBox.textContent = friendlyError(err);
      btn.disabled = false; btn.textContent = "Log in";
    }
  });

  function friendlyError(err) {
    const code = err.code || "";
    if (code.includes("wrong-password") || code.includes("invalid-credential")) return "Incorrect email or password.";
    if (code.includes("user-not-found")) return "No account found with that email.";
    if (code.includes("too-many-requests")) return "Too many attempts. Try again in a moment.";
    return "Something went wrong. Please try again.";
  }
</script>
</body>
</html>
